<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightcall — live demo</title>
<style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}textarea,input{width:100%;margin:.4rem 0;padding:.5rem}pre{background:#111;color:#0f0;padding:1rem;white-space:pre-wrap}.red{color:#f66}.green{color:#0f0}</style></head><body>
<h1>Nightcall — production bug fixer (demo)</h1>
<p>Paste an alert. Nightcall reproduces it, root-causes it, patches it, and verifies tests go red → green. Live CLI calls Nemotron (<code>Nano-30B</code> triage, <code>Ultra-550B</code> reasoning).</p>
<p><button onclick="preset()">Load P1 checkout alert</button> <button onclick="run()">Run loop (simulated)</button></p>
<label>Alert title<input id="t" value="P1 checkout 500s: TypeError in pricing.total"></label>
<label>Stack trace<textarea id="s" rows="3">TypeError: Cannot read properties of undefined (reading 'price') at total (pricing.js)</textarea></label>
<pre id="o">Press "Run loop"...</pre>
<p><small>Repo: <a href="https://github.com/AliceMessi/nightcall">github.com/AliceMessi/nightcall</a></small></p>
<script>
const BUGGY="for (let i = 0; i <= items.length; i++)";
const FIXED="for (let i = 0; i < items.length; i++)";
function preset(){t.value="P1 checkout 500s: TypeError in pricing.total";s.value="TypeError: Cannot read properties of undefined (reading 'price') at total (pricing.js)";run()}
function run(){
 const steps=[
  "[triage:Nano-30B] severity=P1 area=payments/api",
  "[reproduce] run fixture/run.js → FAIL TypeError reading 'price' (red)",
  "[diagnose:Ultra-550B] rootCause=off-by-one, loop reads items[items.length]",
  "[patch] "+BUGGY+" → "+FIXED,
  "[verify] run fixture/run.js → PASS total=20 (green)"
 ];
 o.innerHTML=steps.map((x,i)=>"<span class='"+(i<2?"red":"green")+"'>"+x+"</span>").join("\n")+"\nverdict: fixed:true evidence: nightcall-<ts>.json";
}
</script></body></html>
